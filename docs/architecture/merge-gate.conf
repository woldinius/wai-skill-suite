# merge-gate.conf — this repo's own. Written by hand; wai-init writes it elsewhere.
#
# The hardcoded FLOOR in excluded-domains.sh already covers `.claude/skills/*`, `.claude/agents/*`,
# `.claude-plugin/*` and `.github/*`. This file
# may only WIDEN that, never lower it. What it adds: three paths where this repo's enforcement
# chain leaves the beaten track, two that hold its record, and the twelve default locations Claude
# Code loads from a plugin root:
#
#   install.sh   — it writes into other people's repositories, and it DELETED skills it did not own
#                  once. A bug here destroys a stranger's work.
#   tests/*      — since PR #42 of the repository this one was republished from (2026-08-11),
#                  this IS the enforcement. Gut the runner and the gate goes blind while
#                  every check still reports green. (The floor protects what DEFINES the standard;
#                  this is what PROVES it.)
#   .githooks/*  — the branch guard. It exists because the rule in the prompt was broken three times.
#   docs/field-reports/** — the evidence the suite's claims rest on. A report is a record; it
#                  changes only with a human reading the change.
#   docs/publication/**   — text published under the maintainer's name.
#   agents/* commands/* skills/* hooks/* monitors/* bin/* output-styles/* workflows/* themes/*
#   .mcp.json .lsp.json settings.json — this repo IS a plugin root (marketplace.json:
#                  "source": "./"), and Claude Code loads these default locations there besides
#                  the manifest's own paths; a PR adding hooks/hooks.json or monitors/monitors.json
#                  would run a command on every plugin user's machine (#108's review).
#
# The first three were found by running the gate against PR #42 of the pre-republish repository —
# the first PR there that ever had a CI check to look at. A path whose name carries a family word is tagged by that
# family instead of EX-CONTRACT — checkout/ledger → EX-PAY, proto → EX-API, user/session → EX-AUTH:
# the tag is only a label, and the decision — a human merges — is the same.
CONTRACT_PATHS="install.sh tests/* .githooks/* docs/field-reports/** docs/publication/** agents/* commands/* skills/* hooks/* monitors/* bin/* output-styles/* workflows/* themes/* .mcp.json .lsp.json settings.json"

# No database, no schema. Empty on purpose, not by omission.
MIGRATION_PATHS=""

# No dedicated erasure module — this repo deletes nothing at runtime. Empty on purpose, not by
# omission: the key must be PRESENT (the gate is fail-closed on a missing value), and the
# classifier's added-code-line erasure grep is the backstop if a hard-delete ever appears here.
ERASURE_PATHS=""

# A row rides the PR that produced it — this repo's practice since 2026-08-27, when its last
# row-only chore PR was closed unmerged with the rule (#55). `branch` is the default and what an
# absent key means; written out so the choice is visible. `main` restores the collection path (#66).
LEDGER_HOME="branch"
